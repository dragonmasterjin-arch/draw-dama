class="muted">관리자 모드: ${state.admin?'활성화됨 (다이아 무제한)':'비활성화'}</p></div>`}else{const total=Math.max(state.createdCount||0,state.book.length+(state.stages.egg?1:0));html=`<div class="panel"><h2>📖 펫 도감</h2><div class="bars"><div class="item"><b style="font-size:26px">${total}</b><small>지금까지 만든 펫</small></div><div class="item"><b style="font-size:26px">${state.book.length}</b><small>승천 완료한 펫</small></div></div><p class="muted">현재 키우는 펫: ${state.stages.egg?esc(state.name)+' (Lv.'+state.level+')':'없음'}</p>${state.stages.egg?`<div class="panel"><b>🌱 현재 펫 · ${esc(state.name)}</b><div class="grid">${['egg','lv1','lv2','lv3'].map(k=>state.stages[k]?`<div class="item"><img src="${state.stages[k]}"><small>${k==='egg'?'알':k.toUpperCase()}</small></div>`:'').join('')}</div></div>`:''}${state.book.length?state.book.map((b,i)=>`<div class="panel"><b>🏅 ${i+1}번째 승천 · ${esc(b.name)}</b><p class="muted">${new Date(b.ascendedAt).toLocaleDateString('ko-KR')} 승천</p><div class="grid">${['egg','lv1','lv2','lv3'].map(k=>b.stages[k]?`<div class="item"><img src="${b.stages[k]}"><small>${k==='egg'?'알':k.toUpperCase()}</small></div>`:'').join('')}</div></div>`).join(''):'<div class="empty">아직 승천한 펫은 없어요.</div>'}</div>`} $('otherPage').innerHTML=html;if(tab==='room'){ $('addDeco').onclick=()=>drawEditor('방 장식 그리기',null,image=>{state.decorations.push({image,x:.15+Math.random()*.65,y:.45+Math.random()*.25,scale:80});save();closeModal();renderRoom();switchTab('room');toast('방에 장식을 추가했어요!')});$('removeDeco').onclick=()=>{state.decorations.pop();save();renderRoom();switchTab('room')};$('changeBg').onclick=()=>{showModal('<h2>방 배경색</h2><p>하늘색을 골라주세요.</p><input id="bgColor" class="field" type="color" value="#a5b8d5"><button id="setBg" class="primary full">배경 적용</button>');$('setBg').onclick=()=>{state.bg=$('bgColor').value;applyBg();save();closeModal()}}}if(tab==='shop'){const unlock=(id,cost)=>{if(state.owned.includes(id)){toast('이미 구매했어요.');return}if(!price(cost))return;state.owned.push(id);save();renderHeader();switchTab('shop');toast('구매 완료! 그림판에서 사용할 수 있어요.')};$('buyBooster').onclick=()=>{if(canEvolve()){toast('이미 진화 가능해요!');return}if(!price(5))return;state.stageAt-=DAY;save();renderHeader();switchTab('shop');toast('진화 대기시간 1일 감소!')};$('buyBucket').onclick=()=>unlock('bucket',1);$('buySpecial').onclick=()=>unlock('special',5);$('buyParticle').onclick=()=>{if(!state.owned.includes('particle')){if(!price(20))return;state.owned.push('particle');save()}drawEditor('✨ 파티클 직접 그리기',null,image=>{state.particles.push(image);save();closeModal();renderHeader();toast('파티클 저장! 펫 주위에 표시됩니다.')},{hint:'작게 그리면 펫 주변에서 반짝이는 파티클로 나타나요.'})};$('applyCode').onclick=()=>{if($('adminCode').value.trim()==='kakkak1208'){state.admin=true;save();renderHeader();switchTab('shop');toast('관리자 모드 활성화! 다이아 무제한')}else toast('잘못된 코드예요.')}}}function applyBg(){if(state.bg)$('room').style.background=`linear-gradient(${state.bg} 0 69%, #c9ad91 69% 100%)`}

<script>
(function(){
'use strict';
const key='draw-tamagotchi-proto-v1';
const btn=document.createElement('button');btn.textContent='💾 저장·백업';btn.title='기기 저장 데이터 백업·복구';
btn.style.cssText='position:fixed;right:12px;bottom:92px;z-index:19;background:#4f46a5;color:white;box-shadow:0 4px 14px #0007';
document.body.appendChild(btn);
const file=document.createElement('input');file.type='file';file.accept='.json,application/json';file.style.display='none';document.body.appendChild(file);
function tell(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3500)}
function backup(){
  const raw=localStorage.getItem(key);
  if(!raw){tell('저장된 게임이 없어요.');return}
  const wrapper={format:'draw-tamagotchi-backup',version:1,exportedAt:new Date().toISOString(),data:JSON.parse(raw)};
  const blob=new Blob([JSON.stringify(wrapper)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='draw-tamagotchi-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
  tell('백업 파일을 저장했어요. 안전한 곳에 보관하세요.');
}
function restore(){file.click()}
file.addEventListener('change',async()=>{
  const f=file.files?.[0];file.value='';if(!f)return;
  if(f.size>20*1024*1024){tell('백업 파일이 너무 커요 (최대 20MB).');return}
  try{
    const b=JSON.parse(await f.text());
    if(b?.format!=='draw-tamagotchi-backup'||b.version!==1||typeof b.data!=='object'||!b.data||!b.data.stages||!Array.isArray(b.data.foods)||!Array.isArray(b.data.book)||!Array.isArray(b.data.decorations))throw Error('invalid format');
    if(!confirm('현재 게임 데이터가 백업 내용으로 덮어써집니다. 복원할까요?'))return;
    localStorage.setItem(key,JSON.stringify(b.data));alert('복원이 완료됐어요. 게임을 새로 불러옵니다.');location.reload();
  }catch(e){tell('백업 형식이 올바르지 않거나 저장할 공간이 부족해요.')}
});
btn.onclick=()=>{
  const box=document.getElementById('modalBox');const modal=document.getElementById('modal');
  box.innerHTML='<h2>💾 저장 데이터 관리</h2><p>현재 게임은 로그인 없이 이 기기 브라우저에 저장돼요. 앱 삭제, 브라우저 데이터 삭제, 기기 변경 시 기록이 사라질 수 있습니다.</p><div class="row"><button id="exportGame" class="primary">⬇ 백업 파일 만들기</button><button id="importGame">⬆ 백업 복원</button><button id="closeBackup">닫기</button></div><p>다른 기기로 옮기려면 첫 기기에서 백업 파일을 만든 뒤 새 기기에서 복원하세요. 백업 파일에는 직접 그린 그림과 펫 기록이 포함됩니다.</p>';
  modal.classList.remove('hidden');
  document.getElementById('exportGame').onclick=backup;
  document.getElementById('importGame').onclick=restore;
  document.getElementById('closeBackup').onclick=()=>modal.classList.add('hidden');
};
if('serviceWorker' in navigator && location.protocol==='https:'){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
})();
</script>
